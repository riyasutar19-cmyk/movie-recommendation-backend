<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav>
    <div class="logo">
        My Website
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        
    </ul>
    
<div id="in">
    <input
        id="navSearchInput"
        type="search"
        placeholder="Search movies..."
        aria-label="Search movies"
    >
    <button id="navSearchButton" type="button">Search</button>
</div>

    <button id="themeToggle">🌙 Dark Mode</button>
</nav>

<!-- FEATURED MOVIE CAROUSEL -->
<section id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators" id="featuredIndicators">
        <!-- Indicators added by JavaScript -->
    </div>

    <div class="carousel-inner" id="featuredCarouselInner">
        <div class="carousel-item active">
            <div class="featured-loading">
                Loading featured movies...
            </div>
        </div>
    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#movieCarousel"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#movieCarousel"
            data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>
    </button>

</section>
<h1>Find Your Next Favorite Movie</h1>
<p>Discover trending films, explore new genres, and save the movies you love.</p>
  <div id="rec">
    <input id="int" type="text" placeholder="Search for a movie...">
    <button id="btn">reccomend</button>
  <select id="ratingFilter">
    <option value="all">All Movies</option>
    <option value="8">Rating 8+</option>
    <option value="9">Rating 9+</option>
  </select>
  <select id="genreFilter">
    <option value="all">All Genres</option>
    <option value="Action">Action</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Romance">Romance</option>
</select>
   <select id="sortFilter">
    <option value="default">Default</option>
    <option value="high">Rating: High to Low</option>
    <option value="low">Rating: Low to High</option>
</select>
    <button id="resetFilter">Reset Filters</button>
    <button id="clearSearch">Clear Search</button><button id="showFavorites">❤️ Show Favorites</button>
  </div>
  <p id="movieCount"></p>
<!-- Trailer appears in the marked area -->
<section id="movieDetailsSection" style="display: none;">
    <div id="movieDetails" style="display: none;"></div>
</section>
<!-- Trending Movies -->
<section id="trendingSection">
    <h2>🔥 Trending Movies This Week</h2>
    <div id="trendingMovies">
        <p>Loading trending movies...</p>
    </div>
     </section>
<div id="movieResult"></div>

<button id="loadMore" style="display: none;">Load More</button>

<!-- Movie details and trailer appear below search results -->
<section id="movieDetailsSection" style="display: none;">
    <div id="movieDetails" style="display: none;"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js"></script>  
</body>
</html>
